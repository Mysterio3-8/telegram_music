# Тесты на каждый пуш в main. Выкатку отсюда больше НЕ делаем.
#
# 🔴 15.09: шаг «Выкатка на VPS» (SSH с раннера на сервер) падал во всех 25
# прогонах с 08.09 при зелёных тестах. Теперь сервер сам раз в 2 минуты смотрит
# main и выкатывает коммит, у которого зелёный job `tests` отсюда
# (deploy/pull-deploy.sh, таймер tg-music-pull-deploy). Ни SSH, ни секретов.
#
# ⚠️ Имя job `tests` — часть контракта: сервер ищет проверку ровно с этим именем
# (check-runs?check_name=tests). Переименуешь — автодеплой будет ждать вечно
# (и через час напишет дежурному).
#
# Тесты гоняются здесь, а не на сервере: на VPS одно ядро и 961 МБ.
name: Deploy

on:
  push:
    branches: [main]
  # Ручной перезапуск тестов — и вызов из automerge.yml: слияние под GITHUB_TOKEN
  # не порождает push, поэтому automerge запускает этот workflow явно.
  workflow_dispatch:

concurrency:
  group: tests-${{ github.sha }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Та же версия, что на VPS — иначе тесты проверяют не то, что поедет в прод.
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          # Замок версий — те же пакеты, что поедут на VPS (remote-deploy.sh ставит с -c)
          pip install -r requirements.txt -c requirements.lock
          pip install pytest pytest-asyncio -c requirements.lock

      - name: Тесты
        run: python -m pytest -q
