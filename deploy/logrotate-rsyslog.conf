# Замена /etc/logrotate.d/rsyslog на VPS.
#
# Зачем: штатная настройка ротирует по времени (раз в неделю), а не по размеру.
# На 01.08.2026 это дало /var/log/syslog 350 МБ + syslog.1 229 МБ + kern.log
# 104 МБ — почти полгигабайта на диске в 20 ГБ, причём journalctl --vacuum
# освобождал ровно ноль байт, потому что дело было не в journald.
#
# Установка (от root):
#   cp deploy/logrotate-rsyslog.conf /etc/logrotate.d/rsyslog
#   logrotate -f /etc/logrotate.d/rsyslog
#
# Проверка без применения: logrotate -d /etc/logrotate.d/rsyslog

/var/log/syslog
/var/log/mail.log
/var/log/kern.log
/var/log/auth.log
/var/log/user.log
/var/log/cron.log
/var/log/debug
/var/log/messages
{
	rotate 3
	size 50M
	daily
	missingok
	notifempty
	compress
	delaycompress
	sharedscripts
	postrotate
		/usr/lib/rsyslog/rsyslog-rotate
	endscript
}
