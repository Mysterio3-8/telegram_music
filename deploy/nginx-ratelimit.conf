# /etc/nginx/conf.d/tg-music-ratelimit.conf — ограничение частоты для API.
#
# Аудит снаружи 24.09: 60 запросов подряд доходили до uvicorn все, ни одного
# 429 — то есть любой скрипт мог держать единственное ядро занятым пустыми
# запросами. Пороги щедрые: Mini App на старте шлёт ~10 запросов разом, аудио —
# Range-запросы при каждой перемотке. Замер с обычного домашнего канала — 9
# запросов в секунду, до порога вдвое.
#
# ⚠️ Обычным деплоем НЕ доезжает (как и весь nginx): копировать руками,
# затем `nginx -t && systemctl reload nginx`. Бэкапы — /root/nginx-backups.
limit_req_zone $binary_remote_addr zone=tgm_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=tgm_login:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=tgm_hook:10m rate=5r/s;
limit_req_status 429;
