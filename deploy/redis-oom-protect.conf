; Drop-in для системного redis-server.service (пакетный юнит, не наш).
; Установка: mkdir -p /etc/systemd/system/redis-server.service.d && \
;   cp deploy/redis-oom-protect.conf /etc/systemd/system/redis-server.service.d/override.conf && \
;   systemctl daemon-reload && systemctl restart redis-server
;
; Redis держит FSM-хранилище бота (инцидент 2026-07-26/27: OOM убивал Redis →
; падало FSM → бот переставал отвечать). Redis сам по себе лёгкий — защищаем
; ядром от убийства первым при нехватке памяти.
[Service]
OOMScoreAdjust=-900
