# keybest.cc — Mini App (статика) + API (uvicorn :8010) + webhook ЮKassa.
# HTTPS-блок добавляет certbot: certbot --nginx -d keybest.cc
server {
    listen 80;
    listen [::]:80;
    server_name keybest.cc www.keybest.cc;

    root /opt/tg-music-bot/miniapp;
    index index.html;

    # Статика Mini App. Отдаём ТОЛЬКО то, что лежит на диске; всё остальное 404.
    #
    # Раньше здесь стоял `try_files $uri /index.html` — SPA-фолбэк, который
    # отвечал 200 и HTML на ЛЮБОЙ путь: /wp-login.php, /paypal,
    # /apple-id/verify. Для антифишинговых сканеров сайт, у которого «есть»
    # страница проверки Apple ID, — профиль фишинг-кита. Клиентского роутера у
    # Mini App нет (все экраны — состояние в памяти), поэтому фолбэк не нужен:
    # «/» отдаёт index.html директивой index. См. NEXT_SESSION.md, приоритет №0.
    #
    # no-cache: браузер ревалидирует каждый запрос (304 если не менялось),
    # иначе вернувшиеся пользователи ловят старые ES-модули после деплоя.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Документация репозитория наружу не отдаётся
    location ~ \.md$ {
        return 404;
    }

    # REST API для Mini App (префикс /api срезается)
    location /api/ {
        proxy_pass http://127.0.0.1:8010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 60m;
    }

    # Уведомления ЮKassa
    location /webhook/ {
        proxy_pass http://127.0.0.1:8010/webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
