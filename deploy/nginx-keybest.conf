# keybest.cc — Mini App (статика) + API (uvicorn :8010) + webhook ЮKassa.
# HTTPS-блок добавляет certbot: certbot --nginx -d keybest.cc
#
# ⚠️ В HTTPS-блоке (его пишет certbot, поэтому здесь его нет) должна стоять
# строка `http2 on;`. Без неё браузер тянет 50 файлов Mini App по HTTP/1.1,
# то есть по шесть за раз с очередью — при модульном графе это лишние круги
# ожидания. Строку certbot не добавляет и при обновлении сертификата не трогает.
server {
    listen 80;
    listen [::]:80;
    server_name keybest.cc www.keybest.cc;

    root /opt/tg-music-bot/miniapp;
    index index.html;

    # Сжатие. В nginx.conf стоит `gzip on`, но `gzip_types` там закомментирован —
    # а по умолчанию это ровно text/html. То есть 46 ES-модулей и 4 таблицы
    # стилей ехали к человеку в исходном виде: замер 15.08 — 348 КБ сырьём
    # против 109 КБ сжатыми (3.2 раза). Это и была главная часть «долго грузит».
    # application/json — ради ответов API: одно только дерево жанров 69 КБ → 15 КБ.
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;

    # Статика Mini App. Отдаём ТОЛЬКО то, что лежит на диске; всё остальное 404.
    #
    # Раньше здесь стоял `try_files $uri /index.html` — SPA-фолбэк, который
    # отвечал 200 и HTML на ЛЮБОЙ путь: /wp-login.php, /paypal,
    # /apple-id/verify. Для антифишинговых сканеров сайт, у которого «есть»
    # страница проверки Apple ID, — профиль фишинг-кита. Клиентского роутера у
    # Mini App нет (все экраны — состояние в памяти), поэтому фолбэк не нужен:
    # «/» отдаёт index.html директивой index. См. NEXT_SESSION.md, приоритет №0.
    #
    # no-cache: браузер ревалидирует каждый запрос (304 если не менялось),
    # иначе вернувшиеся пользователи ловят старые ES-модули после деплоя.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Документация репозитория наружу не отдаётся
    location ~ \.md$ {
        return 404;
    }

    # REST API для Mini App (префикс /api срезается)
    location /api/ {
        proxy_pass http://127.0.0.1:8010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 60m;
    }

    # Уведомления ЮKassa
    location /webhook/ {
        proxy_pass http://127.0.0.1:8010/webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
